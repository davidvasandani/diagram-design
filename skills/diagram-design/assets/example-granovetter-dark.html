<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who can change production · Granovetter</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Granovetter · Diagram Design</p>
    <h1>Who can change production</h1>

    <div>
      <div class="diagram-container">
        <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="granovetter-dark-title granovetter-dark-desc" data-diagram-type="granovetter">
          <title id="granovetter-dark-title">Who can change production</title>
          <desc id="granovetter-dark-desc">Granovetter diagram of production access: contributors drive the CI runner, the runner assumes the deploy role, and the deploy role writes to production. Cloud admins hold production directly and can extend the deploy role's trust, and break-glass users can assume the deploy role, with the control or missing control on each path.</desc>
          <defs>
            <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
            <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
            <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
          </defs>

          <rect width="100%" height="100%" fill="#2d3142"/>

          <!-- Edges (drawn before everything else) -->
          <path data-gv-edge="org-admin" data-gv-from="admins" data-gv-to="prod" data-gv-kind="held" d="M 280,120 V 96 Q 280,88 288,88 H 1112 Q 1120,88 1120,96 V 175" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
          <path data-gv-edge="edit-trust" data-gv-from="admins" data-gv-to="deploy" data-gv-kind="introduce" data-gv-carries="prod" d="M 340,180 H 592 Q 600,180 600,188 V 212 Q 600,220 608,220 H 742.4" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <path data-gv-edge="assume" data-gv-from="breakglass" data-gv-to="deploy" data-gv-kind="obtain" d="M 340,360 H 632 Q 640,360 640,352 V 268 Q 640,260 648,260 H 742.4" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <path data-gv-edge="open-pr" data-gv-from="contributors" data-gv-to="ci" data-gv-kind="held" d="M 336.6,540 H 742.4" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
          <path data-gv-edge="merge" data-gv-from="contributors" data-gv-to="ci" data-gv-kind="held" d="M 336.6,580 H 742.4" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
          <path data-gv-edge="oidc" data-gv-from="ci" data-gv-to="deploy" data-gv-kind="held" d="M 800,500 V 301" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
          <path data-gv-edge="deploy-write" data-gv-from="deploy" data-gv-to="prod" data-gv-kind="held" d="M 860,240 H 1055" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

          <!-- Edge labels (masked) -->
          <g data-gv-for="org-admin">
            <rect x="658" y="64" width="84" height="14" rx="2" fill="#2d3142"/>
            <text x="700" y="74" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ORG ADMIN</text>
          </g>
          <g data-gv-for="edit-trust">
            <rect x="424" y="146" width="92" height="14" rx="2" fill="#2d3142"/>
            <text x="470" y="156" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EDIT TRUST</text>
          </g>
          <g data-gv-for="assume">
            <rect x="420" y="326" width="100" height="14" rx="2" fill="#2d3142"/>
            <text x="470" y="336" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ASSUME ROLE</text>
          </g>
          <g data-gv-for="open-pr">
            <rect x="506" y="506" width="68" height="14" rx="2" fill="#2d3142"/>
            <text x="540" y="516" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPEN PR</text>
          </g>
          <g data-gv-for="merge">
            <rect x="514" y="614" width="52" height="14" rx="2" fill="#2d3142"/>
            <text x="540" y="624" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MERGE</text>
          </g>
          <g data-gv-for="deploy-write">
            <rect x="928" y="266" width="60" height="14" rx="2" fill="#2d3142"/>
            <text x="958" y="276" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITES</text>
          </g>

          <!-- Control gates: control (solid), missing (dashed), gap (dashed accent, max 2) -->
          <g data-gv-gate="standing-admin" data-gv-on="edit-trust" data-gv-state="gap">
            <rect x="396" y="168" width="148" height="24" rx="2" fill="#2d3142"/>
            <rect x="396" y="168" width="148" height="24" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="4,3"/>
            <text x="470" y="183" fill="#f08a59" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">standing · no JIT</text>
          </g>
          <g data-gv-gate="mfa-ticket" data-gv-on="assume" data-gv-state="control">
            <rect x="410" y="348" width="120" height="24" rx="2" fill="#2d3142"/>
            <rect x="410" y="348" width="120" height="24" rx="2" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1"/>
            <text x="470" y="363" fill="#f5f5f5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MFA + ticket</text>
          </g>
          <g data-gv-gate="pr-workflows" data-gv-on="open-pr" data-gv-state="gap">
            <rect x="432" y="528" width="216" height="24" rx="2" fill="#2d3142"/>
            <rect x="432" y="528" width="216" height="24" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="4,3"/>
            <text x="540" y="543" fill="#f08a59" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workflows run on PR</text>
          </g>
          <g data-gv-gate="reviews" data-gv-on="merge" data-gv-state="control">
            <rect x="432" y="568" width="216" height="24" rx="2" fill="#2d3142"/>
            <rect x="432" y="568" width="216" height="24" rx="2" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1"/>
            <text x="540" y="583" fill="#f5f5f5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2 reviews + CODEOWNERS</text>
          </g>
          <g data-gv-gate="oidc-main" data-gv-on="oidc" data-gv-state="control">
            <rect x="704" y="388" width="192" height="24" rx="2" fill="#2d3142"/>
            <rect x="704" y="388" width="192" height="24" rx="2" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1"/>
            <text x="800" y="403" fill="#f5f5f5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OIDC · main branch only</text>
          </g>
          <g data-gv-gate="session-policy" data-gv-on="deploy-write" data-gv-state="missing">
            <rect x="898" y="228" width="120" height="24" rx="2" fill="#2d3142"/>
            <rect x="898" y="228" width="120" height="24" rx="2" fill="rgba(245,245,245,0.03)" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3"/>
            <text x="958" y="243" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no session policy</text>
          </g>

          <!-- Carried references on introduce edges -->
          <g data-gv-chip="edit-trust">
            <rect x="612" y="211" width="112" height="18" rx="9" fill="#2d3142"/>
            <rect x="612" y="211" width="112" height="18" rx="9" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1"/>
            <text x="668" y="223" fill="#f5f5f5" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">carries Production</text>
          </g>

          <!-- Principals (painted last) -->
          <g data-gv-node="admins" data-gv-label="Cloud admins">
            <circle cx="280" cy="180" r="60" fill="#2d3142"/>
            <circle cx="280" cy="180" r="60" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
            <text x="280" y="176" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloud admins</text>
            <text x="280" y="192" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 standing</text>
          </g>
          <g data-gv-node="breakglass" data-gv-label="Break-glass users">
            <circle cx="280" cy="360" r="60" fill="#2d3142"/>
            <circle cx="280" cy="360" r="60" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
            <text x="280" y="348.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Break-glass</text>
            <text x="280" y="363.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">users</text>
            <text x="280" y="379.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2 named</text>
          </g>
          <g data-gv-node="contributors" data-gv-label="Contributors">
            <circle cx="280" cy="560" r="60" fill="#2d3142"/>
            <circle cx="280" cy="560" r="60" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
            <text x="280" y="556" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contributors</text>
            <text x="280" y="572" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">38 with push</text>
          </g>
          <g data-gv-node="deploy" data-gv-label="Deploy role">
            <circle cx="800" cy="240" r="60" fill="#2d3142"/>
            <circle cx="800" cy="240" r="60" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
            <text x="800" y="236" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Deploy role</text>
            <text x="800" y="252" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cloud IAM role</text>
          </g>
          <g data-gv-node="ci" data-gv-label="CI runner">
            <circle cx="800" cy="560" r="60" fill="#2d3142"/>
            <circle cx="800" cy="560" r="60" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
            <text x="800" y="556" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CI runner</text>
            <text x="800" y="572" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">self-hosted</text>
          </g>
          <g data-gv-node="prod" data-gv-label="Production">
            <circle cx="1120" cy="240" r="64" fill="#2d3142"/>
            <circle cx="1120" cy="240" r="64" fill="rgba(245,245,245,0.10)" stroke="#f5f5f5" stroke-width="1.2"/>
            <text x="1120" y="236" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Production</text>
            <text x="1120" y="252" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cluster · data</text>
          </g>

          <!-- Legend -->
          <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
          <text x="40" y="683" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
          <circle cx="132" cy="680" r="9" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
          <text x="148" y="683" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace">principal</text>
          <line x1="236" y1="680" x2="272" y2="680" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
          <text x="280" y="683" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace">holds</text>
          <line x1="336" y1="680" x2="372" y2="680" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <text x="380" y="683" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace">one action away</text>
          <rect x="500" y="671" width="64" height="18" rx="9" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1"/>
          <text x="572" y="683" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace">carried reference</text>
          <rect x="708" y="672" width="28" height="16" rx="2" fill="rgba(245,245,245,0.04)" stroke="#bfc0c0" stroke-width="1"/>
          <text x="744" y="683" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace">control</text>
          <rect x="820" y="672" width="28" height="16" rx="2" fill="rgba(245,245,245,0.03)" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="856" y="683" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace">missing control</text>
          <rect x="976" y="672" width="28" height="16" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="4,3"/>
          <text x="1012" y="683" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace">focal gap</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
