<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Granovetter trace template · Diagram Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }

    /* Trace states. The controller only toggles these classes; the static
       frame below is complete without them. */
    [data-trace-root][data-trace-active="true"] .is-dim { opacity: 0.16; }
    [data-trace-root] .is-revoked { opacity: 0.12; }
    [data-trace-root] [data-gv-node].is-source { stroke-width: 2; }
    [data-gv-node] { cursor: pointer; }
    @media (prefers-reduced-motion: no-preference) {
      [data-gv-node], [data-gv-edge], [data-gv-gate], [data-gv-for], [data-gv-chip] { transition: opacity 160ms ease; }
    }

    .trace-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: flex-start;
      margin-top: 16px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-muted);
    }
    .trace-controls[hidden] { display: none; }
    .trace-controls fieldset { border: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .trace-controls legend { float: left; margin-right: 8px; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.62rem; }
    .trace-controls button {
      font: inherit;
      color: var(--color-ink);
      background: #ffffff;
      border: 1px solid rgba(45,49,66,0.30);
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .trace-controls button[aria-pressed="true"] { border-color: var(--color-ink); background: rgba(45,49,66,0.08); }
    .trace-controls button:focus-visible, .trace-controls input:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
    .trace-controls label { display: inline-flex; gap: 6px; align-items: center; }
    .trace-status { min-height: 1.4em; margin-top: 8px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--color-ink); }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
      .trace-controls, .trace-status { display: none; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Granovetter · Diagram Design</p>
    <h1>[Diagram title]</h1>

    <!-- Replace [diagram-slug] before export. The static SVG must carry the whole
         meaning; the controls stay hidden until the controller runs. -->
    <div data-trace-root>
      <div class="diagram-container">
        <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="[diagram-slug]-title [diagram-slug]-desc" data-diagram-type="granovetter">
          <title id="[diagram-slug]-title">[Diagram title]</title>
          <desc id="[diagram-slug]-desc">[One sentence describing who holds which permission]</desc>
          <defs>
            <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
            <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
            <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          </defs>

          <rect width="100%" height="100%" fill="#f5f5f5"/>

          <!-- Edges first: data-gv-edge, data-gv-from, data-gv-to, data-gv-kind (held | obtain | introduce).
               Then edge labels (data-gv-for), gates (data-gv-gate + data-gv-on + data-gv-state),
               chips (data-gv-chip) and finally principals (data-gv-node + data-gv-label). -->

        </svg>
      </div>

      <div class="trace-controls" data-trace-controls hidden>
        <fieldset>
          <legend>Trace reach from</legend>
          <!-- One button per principal: <button type="button" data-trace-select="id" aria-pressed="false">Name</button> -->
        </fieldset>
        <label><input type="checkbox" data-trace-intro> Include one-action-away arrows</label>
        <fieldset>
          <legend>Revoke</legend>
          <!-- One button per edge worth testing: <button type="button" data-trace-revoke="edge-id" aria-pressed="false">From → To</button> -->
        </fieldset>
        <button type="button" data-trace-reset>Reset</button>
      </div>
      <p class="trace-status" data-trace-status role="status" aria-live="polite" aria-atomic="true"></p>
    </div>
  </div>

  <script data-diagram-trace>
    (() => {
      const params = new URLSearchParams(location.search);
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-trace-root]').forEach((root) => {
        const nodes = new Map([...root.querySelectorAll('[data-gv-node]')].map((el) => [el.dataset.gvNode, el]));
        const edges = [...root.querySelectorAll('[data-gv-edge]')].map((el) => ({
          el,
          id: el.dataset.gvEdge,
          from: el.dataset.gvFrom,
          to: el.dataset.gvTo,
          kind: ['obtain', 'introduce'].includes(el.dataset.gvKind) ? el.dataset.gvKind : 'held',
          carries: el.dataset.gvCarries || '',
        }));
        const bound = [...root.querySelectorAll('[data-gv-gate], [data-gv-for], [data-gv-chip]')].map((el) => ({
          el,
          edge: el.dataset.gvOn || el.dataset.gvFor || el.dataset.gvChip,
        }));
        const controls = root.querySelector('[data-trace-controls]');
        const status = root.querySelector('[data-trace-status]');
        const introToggle = root.querySelector('[data-trace-intro]');
        const selectButtons = [...root.querySelectorAll('[data-trace-select]')];
        const revokeButtons = [...root.querySelectorAll('[data-trace-revoke]')];
        const name = (id) => (nodes.get(id) && nodes.get(id).dataset.gvLabel) || id;
        const revoked = new Set();
        let pinned = null;
        let preview = null;

        function reach(source) {
          const withIntro = Boolean(introToggle && introToggle.checked);
          const seen = new Set([source]);
          const used = new Set();
          let grew = true;
          while (grew) {
            grew = false;
            edges.forEach((edge) => {
              if (revoked.has(edge.id) || !seen.has(edge.from) || used.has(edge.id)) return;
              if (edge.kind !== 'held' && !withIntro) return;
              if (edge.kind === 'introduce') {
                if (!seen.has(edge.to) || !nodes.has(edge.carries)) return;
                used.add(edge.id);
                if (!seen.has(edge.carries)) seen.add(edge.carries);
                grew = true;
                return;
              }
              used.add(edge.id);
              if (!seen.has(edge.to)) seen.add(edge.to);
              grew = true;
            });
          }
          return { seen, used };
        }

        function describe(source, seen) {
          const reached = [...seen].filter((id) => id !== source).map(name);
          const cut = revoked.size ? ` ${revoked.size} revoked.` : '';
          if (!reached.length) return `${name(source)} reaches nothing else.${cut}`;
          return `${name(source)} reaches ${reached.length}: ${reached.join(', ')}.${cut}`;
        }

        function render(announce = false) {
          const source = preview || pinned;
          root.dataset.traceActive = String(Boolean(source));
          edges.forEach((edge) => edge.el.classList.toggle('is-revoked', revoked.has(edge.id)));
          bound.forEach((item) => item.el.classList.toggle('is-revoked', revoked.has(item.edge)));
          selectButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.traceSelect === pinned)));
          revokeButtons.forEach((button) => button.setAttribute('aria-pressed', String(revoked.has(button.dataset.traceRevoke))));
          const all = [...nodes.values(), ...edges.map((edge) => edge.el), ...bound.map((item) => item.el)];
          if (!source) {
            all.forEach((el) => el.classList.remove('is-source', 'is-reached', 'is-dim'));
            if (announce) status.textContent = revoked.size ? `${revoked.size} revoked. Pick a principal to trace.` : 'Pick a principal to trace.';
            return;
          }
          const { seen, used } = reach(source);
          nodes.forEach((el, id) => {
            el.classList.toggle('is-source', id === source);
            el.classList.toggle('is-reached', seen.has(id) && id !== source);
            el.classList.toggle('is-dim', !seen.has(id));
          });
          edges.forEach((edge) => {
            edge.el.classList.toggle('is-reached', used.has(edge.id));
            edge.el.classList.toggle('is-dim', !used.has(edge.id));
          });
          bound.forEach((item) => {
            item.el.classList.toggle('is-reached', used.has(item.edge));
            item.el.classList.toggle('is-dim', !used.has(item.edge));
          });
          if (announce || source === pinned) status.textContent = describe(source, seen);
        }

        selectButtons.forEach((button) => button.addEventListener('click', () => {
          pinned = pinned === button.dataset.traceSelect ? null : button.dataset.traceSelect;
          preview = null;
          render(true);
        }));
        revokeButtons.forEach((button) => button.addEventListener('click', () => {
          const id = button.dataset.traceRevoke;
          if (revoked.has(id)) revoked.delete(id); else revoked.add(id);
          render(true);
        }));
        if (introToggle) introToggle.addEventListener('change', () => render(true));
        const reset = root.querySelector('[data-trace-reset]');
        if (reset) reset.addEventListener('click', () => {
          pinned = null;
          preview = null;
          revoked.clear();
          if (introToggle) introToggle.checked = false;
          render(true);
        });
        nodes.forEach((el, id) => {
          el.addEventListener('pointerenter', () => { preview = id; render(false); });
          el.addEventListener('pointerleave', () => { preview = null; render(false); });
          el.addEventListener('click', () => { pinned = pinned === id ? null : id; preview = null; render(true); });
        });
        root.addEventListener('keydown', (event) => {
          if (event.key !== 'Escape') return;
          pinned = null;
          preview = null;
          render(true);
        });

        const requested = params.get('trace');
        if (requested && nodes.has(requested)) pinned = requested;
        if (introToggle && params.get('intro') === '1') introToggle.checked = true;
        (params.get('revoke') || '').split(',').filter((id) => edges.some((edge) => edge.id === id)).forEach((id) => revoked.add(id));
        controls.hidden = false;
        render(Boolean(pinned));
      });
    })();
  </script>
</body>
</html>
